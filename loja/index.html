:root{--c:#4a2a1f;--bg:color-mix(in srgb,var(--c) 6%,#f7fbf8);--soft:color-mix(in srgb,var(--c) 12%,#fff);--ink:#2b1a14;--mu:#76665c;--ok:#1fa855}
*{box-sizing:border-box;margin:0;padding:0;min-width:0}
body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--ink);padding-bottom:96px;overflow-x:clip}
header{background:var(--c);color:#fff;text-align:center;padding:0 0 52px;position:relative}
.hero{display:block;width:100%;aspect-ratio:3/1;object-fit:cover;margin-bottom:-42px}
header .sp{height:28px}
.logo{width:104px;height:104px;border-radius:50%;object-fit:cover;border:4px solid #fff;position:relative;background:#fff;box-shadow:0 6px 18px rgba(0,0,0,.25)}
.ini{width:104px;height:104px;border-radius:50%;border:4px solid #fff;display:inline-flex;align-items:center;justify-content:center;font-size:2.4rem;font-weight:800;background:color-mix(in srgb,var(--c) 70%,#000);position:relative}
h1{font-size:1.9rem;margin-top:10px;line-height:1.1;padding:0 16px}
.tag{opacity:.88;margin-top:4px;padding:0 16px}
.chips{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:12px;padding:0 12px}
.chip{background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.35);padding:5px 12px;border-radius:99px;font-size:.85rem}
nav{position:sticky;top:0;z-index:5;background:var(--bg);display:flex;gap:8px;overflow-x:auto;padding:12px 16px;margin-top:-24px;border-radius:22px 22px 0 0;scrollbar-width:none}
nav a{flex:none;text-decoration:none;color:var(--c);font-weight:600;padding:8px 16px;border-radius:99px;background:var(--soft);font-size:.95rem}
nav a.on{background:var(--c);color:#fff}
main{max-width:760px;margin:0 auto;padding:0 16px}
h2{color:var(--c);font-size:1.4rem;margin:24px 0 12px;scroll-margin-top:70px}
.card{display:flex;gap:14px;background:#fff;border-radius:18px;padding:12px;margin-bottom:12px;box-shadow:0 2px 10px rgba(0,0,0,.06);align-items:center}
.card img,.card .ph{width:100px;height:100px;border-radius:14px;object-fit:cover;flex:none}
.ph{display:flex;align-items:center;justify-content:center;background:var(--soft)}
.ph svg{width:70%;height:70%}
.info{flex:1}.info h3{font-size:1rem;line-height:1.25}.info p{color:var(--mu);font-size:.85rem;margin-top:3px;line-height:1.3}
.row{display:flex;align-items:center;justify-content:space-between;margin-top:8px;gap:8px;flex-wrap:wrap}
.price{font-weight:700;color:var(--c);white-space:nowrap}
.add{background:var(--c);color:#fff;border:0;border-radius:99px;padding:9px 14px;font-weight:700;font-size:.9rem;cursor:pointer}
.add.ok{background:var(--ok)}
.qty{display:inline-flex;align-items:center;gap:10px;background:var(--soft);border-radius:99px;padding:3px}
.qty button{width:32px;height:32px;border-radius:50%;border:0;background:var(--c);color:#fff;font-size:1.1rem;font-weight:700;cursor:pointer}
.qty span{min-width:14px;text-align:center;font-weight:700}
.bar{position:fixed;left:12px;right:12px;bottom:12px;max-width:736px;margin:0 auto;background:var(--c);color:#fff;border-radius:18px;padding:14px 18px;display:flex;justify-content:space-between;align-items:center;cursor:pointer;box-shadow:0 8px 24px rgba(0,0,0,.25);transform:translateY(140%);transition:.25s;z-index:10;border:0;font:inherit}
.bar.show{transform:none}
.sheet{position:fixed;inset:0;background:rgba(20,10,5,.5);display:none;z-index:20;align-items:flex-end;justify-content:center}
.sheet.open{display:flex}
.panel{background:var(--bg);width:100%;max-width:760px;max-height:92vh;overflow:auto;border-radius:24px 24px 0 0;padding:20px 18px 24px}
.close{float:right;background:none;border:0;font-size:1.7rem;cursor:pointer;color:var(--c);width:44px;height:44px}
.li{display:flex;justify-content:space-between;gap:10px;padding:10px 0;border-bottom:1px dashed #ddd;align-items:center}
.li small{display:block;color:var(--mu);font-size:.8rem}
label{display:block;font-weight:600;font-size:.9rem;margin:14px 0 5px;color:var(--c)}
input,textarea,select{width:100%;padding:12px;border:1.5px solid #e2d6c8;border-radius:12px;font:inherit;font-size:16px;background:#fff}
textarea{min-height:64px}
.pay{display:flex;gap:8px;flex-wrap:wrap}
.pay label{margin:0;font-weight:500;background:#fff;border:1.5px solid #e2d6c8;border-radius:99px;padding:9px 14px;cursor:pointer;color:var(--ink)}
.pay input{display:none}.pay label:has(input:checked){background:var(--c);color:#fff;border-color:var(--c)}
.tot{display:flex;justify-content:space-between;font-size:1.1rem;font-weight:700;margin-top:16px;color:var(--c)}
.send{display:block;text-align:center;text-decoration:none;margin-top:16px;background:var(--ok);color:#fff;border-radius:14px;padding:15px;font-size:1.05rem;font-weight:700}
.err{color:#c8324a;font-size:.85rem;margin-top:8px;display:none}
.opt .panel{padding:0}.opt .hd img{width:100%;height:180px;object-fit:cover;display:block;border-radius:24px 24px 0 0}
.opt .bd{padding:14px 18px}.opt h3{font-size:1.2rem;color:var(--c)}
.gh{display:flex;justify-content:space-between;align-items:center;background:var(--soft);margin:16px -18px 4px;padding:10px 18px}
.gh small{color:var(--mu);display:block}
.req{background:var(--c);color:#fff;font-size:.72rem;font-weight:700;padding:3px 9px;border-radius:99px}.req.ok{background:var(--ok)}
.op{display:flex;align-items:center;padding:12px 2px;border-bottom:1px solid #eee;margin:0;font-weight:500;color:var(--ink);cursor:pointer}
.op span{flex:1}.op em{font-style:normal;color:var(--mu);font-size:.85rem;margin-right:10px}
.op input{width:22px;height:22px;accent-color:var(--c);flex:none}.op.off{opacity:.4}
.ft{position:sticky;bottom:0;background:var(--bg);display:flex;gap:10px;padding:12px 18px;border-top:1px solid #e2d6c8}
.go{flex:1;background:var(--c);color:#fff;border:0;border-radius:14px;font-weight:700;font-size:1rem;cursor:pointer;padding:12px}.go:disabled{opacity:.45}
footer{text-align:center;color:var(--mu);font-size:.85rem;padding:28px 16px 8px}
.empty{text-align:center;color:var(--mu);padding:40px 10px}
</style>

<main id="menu"></main>
